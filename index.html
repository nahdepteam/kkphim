<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CineSync - Phim Đa Nguồn</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Tông màu Slate trầm, tối giản, tuyệt đối không dùng màu nóng
                        base: '#0f172a',        // slate-900
                        surface: '#1e293b',     // slate-800
                        surfaceHover: '#334155',// slate-700
                        borderMuted: '#334155', // slate-700
                        textMain: '#f1f5f9',    // slate-100
                        textMuted: '#94a3b8',   // slate-400
                        accent: '#cbd5e1',      // slate-300
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--color-base, #0f172a);
            color: var(--color-textMain, #f1f5f9);
            -webkit-font-smoothing: antialiased;
        }

        /* Thanh cuộn tinh tế */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Ẩn thanh cuộn cho slider ngang */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Spinner */
        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid #334155;
            border-top-color: #cbd5e1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Tránh bôi đen khi kéo */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans bg-base text-textMain selection:bg-surfaceHover selection:text-white">

    <!-- Header navigation -->
    <header class="sticky top-0 z-50 bg-base/90 backdrop-blur-md border-b border-borderMuted">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between gap-4 md:gap-8">
            <!-- Logo -->
            <button onclick="app.navigate('home')" class="flex items-center gap-2 text-xl font-medium text-white hover:text-textMuted transition-colors outline-none tracking-wide shrink-0">
                <i class="ph ph-film-strip text-2xl text-accent"></i>
                <span class="hidden sm:block">CINE<span class="font-light text-textMuted">SYNC</span></span>
            </button>

            <!-- Search Form -->
            <form id="search-form" class="flex-1 max-w-2xl relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="ph ph-magnifying-glass text-textMuted"></i>
                </div>
                <input type="text" id="search-input" 
                       class="w-full bg-surface border border-borderMuted rounded-full py-2 pl-11 pr-4 text-sm text-textMain placeholder-textMuted focus:outline-none focus:border-textMuted focus:bg-surfaceHover transition-all shadow-inner" 
                       placeholder="Tìm kiếm phim (KKPhim & NguonC)...">
            </form>

            <!-- Menu -->
            <button onclick="app.navigate('history')" class="flex items-center gap-2 text-textMuted hover:text-white transition-colors outline-none p-2 md:px-4 md:py-2 rounded-full hover:bg-surface border border-transparent hover:border-borderMuted shrink-0">
                <i class="ph ph-clock-counter-clockwise text-xl"></i>
                <span class="hidden md:block text-sm font-medium">Lịch sử xem</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto px-4 py-8 relative">
        
        <!-- Loading Overlay -->
        <div id="loading-overlay" class="hidden absolute inset-0 z-40 bg-base/80 backdrop-blur-sm flex flex-col items-center justify-center pt-32">
            <div class="spinner mb-4"></div>
            <p class="text-textMuted text-sm tracking-widest uppercase font-medium">Đang xử lý</p>
        </div>

        <!-- VIEW: HOME -->
        <div id="view-home" class="view-section hidden flex flex-col gap-12">
            <!-- Phim Nổi Bật (Vuốt ngang - NguonC) -->
            <section>
                <div class="flex items-center justify-between mb-5">
                    <h2 class="text-xl font-light text-white flex items-center gap-2 tracking-wide">
                        <i class="ph ph-trend-up text-accent"></i> Phim Nổi Bật <span class="text-xs text-textMuted bg-surface px-2 py-1 rounded-md ml-2 border border-borderMuted">NguonC</span>
                    </h2>
                </div>
                <!-- Container vuốt ngang -->
                <div id="home-trending-container" class="flex overflow-x-auto gap-4 hide-scrollbar pb-4 snap-x cursor-grab no-select relative w-full">
                    <!-- Loading placeholder -->
                    <div class="w-full text-center text-textMuted py-16 bg-surface/30 rounded-xl border border-borderMuted">
                        <i class="ph ph-spinner animate-spin text-2xl mb-2 inline-block"></i>
                    </div>
                </div>
            </section>

            <!-- Phim Chiếu Rạp / Phim Lẻ (Grid - KKPhim) -->
            <section>
                <div class="flex items-center justify-between mb-5">
                    <h2 class="text-xl font-light text-white flex items-center gap-2 tracking-wide">
                        <i class="ph ph-popcorn text-accent"></i> Phim Chiếu Rạp / Lẻ <span class="text-xs text-textMuted bg-surface px-2 py-1 rounded-md ml-2 border border-borderMuted">KKPhim</span>
                    </h2>
                </div>
                <div id="home-theater-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-5">
                    <!-- Loading placeholder -->
                    <div class="w-full col-span-full text-center text-textMuted py-16 bg-surface/30 rounded-xl border border-borderMuted">
                        <i class="ph ph-spinner animate-spin text-2xl mb-2 inline-block"></i>
                    </div>
                </div>
            </section>
        </div>

        <!-- VIEW: SEARCH RESULTS -->
        <div id="view-search" class="view-section hidden">
            <h2 class="text-xl font-light mb-6 flex items-center gap-2 text-textMuted border-b border-borderMuted pb-4">
                Kết quả tìm kiếm cho: <span id="search-keyword-display" class="text-white font-medium italic"></span>
            </h2>
            <div id="search-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-5">
                <!-- Thẻ phim render tại đây -->
            </div>
            <div id="search-empty" class="hidden text-center py-20 bg-surface/30 rounded-xl border border-borderMuted mt-4">
                <i class="ph ph-ghost text-4xl text-borderMuted mb-3"></i>
                <p class="text-textMuted">Không tìm thấy kết quả phù hợp từ các nguồn.</p>
            </div>
        </div>

        <!-- VIEW: DETAIL & PLAYER -->
        <div id="view-detail" class="view-section hidden">
            <!-- Breadcrumb -->
            <div class="flex items-center gap-2 text-sm text-textMuted mb-6 pb-4 border-b border-borderMuted">
                <button onclick="app.navigate('home')" class="hover:text-white transition-colors"><i class="ph ph-house"></i></button>
                <i class="ph ph-caret-right text-xs"></i>
                <span id="detail-source-badge" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-surface border border-borderMuted"></span>
                <i class="ph ph-caret-right text-xs"></i>
                <span id="detail-breadcrumb-name" class="text-textMain truncate"></span>
            </div>

            <div class="flex flex-col lg:flex-row gap-6">
                <!-- Khu vực Video & Thông tin -->
                <div class="w-full lg:w-3/4 flex flex-col gap-4">
                    <!-- Trình phát video -->
                    <div class="w-full aspect-video bg-black rounded-xl border border-borderMuted overflow-hidden relative shadow-lg">
                        <video id="player" class="w-full h-full object-contain" controls playsinline></video>
                        
                        <!-- Lớp phủ khi chưa phát -->
                        <div id="player-overlay" class="absolute inset-0 bg-base/90 flex flex-col items-center justify-center z-10 transition-opacity">
                            <div class="text-center px-4">
                                <button onclick="app.playFirstAvailableEpisode()" class="w-16 h-16 bg-surface hover:bg-surfaceHover text-white rounded-full flex items-center justify-center transition-all border border-borderMuted hover:border-accent hover:scale-105 shadow-xl group">
                                    <i class="ph-fill ph-play text-2xl ml-1 group-hover:text-accent transition-colors"></i>
                                </button>
                                <p class="mt-4 text-sm font-medium text-textMuted tracking-wider uppercase">Chọn tập hoặc Bấm Play</p>
                            </div>
                        </div>
                    </div>

                    <!-- Thông báo đồng bộ (nhỏ gọn) -->
                    <div id="sync-notification" class="hidden flex items-center justify-between bg-surface border border-borderMuted text-textMuted px-4 py-2.5 rounded-lg text-sm transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <i class="ph ph-cloud-check text-accent text-lg"></i> 
                            <span id="sync-message">Đã lưu tiến trình xem lên Cloud.</span>
                        </div>
                    </div>

                    <!-- Chi tiết phim -->
                    <div class="pt-2 bg-surface/30 p-6 rounded-xl border border-borderMuted">
                        <h1 id="detail-title" class="text-2xl md:text-3xl font-medium text-white mb-1"></h1>
                        <p id="detail-origin-name" class="text-textMuted text-sm mb-6 font-light italic"></p>
                        <div class="prose prose-invert prose-slate max-w-none text-sm text-textMain leading-relaxed opacity-90">
                            <div id="detail-content"></div>
                        </div>
                    </div>
                </div>

                <!-- Danh sách tập phim -->
                <div class="w-full lg:w-1/4">
                    <div class="bg-surface border border-borderMuted rounded-xl flex flex-col h-full lg:max-h-[800px]">
                        <div class="p-4 border-b border-borderMuted text-sm font-medium tracking-wide text-white flex items-center gap-2 bg-surfaceHover/50 rounded-t-xl">
                            <i class="ph ph-list-numbers text-accent"></i> DANH SÁCH TẬP
                        </div>
                        <div class="p-4 overflow-y-auto flex-1 custom-scrollbar">
                            <div id="episodes-container" class="flex flex-col gap-6">
                                <!-- Thẻ tập phim render tại đây -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW: HISTORY -->
        <div id="view-history" class="view-section hidden">
            <div class="flex items-center justify-between mb-8 pb-4 border-b border-borderMuted">
                <h2 class="text-xl font-light text-white flex items-center gap-2 tracking-wide">
                    <i class="ph ph-clock-counter-clockwise text-accent"></i> Lịch sử xem (Đồng bộ Cloud)
                </h2>
                <div id="history-sync-status" class="text-xs text-textMuted flex items-center gap-1 bg-surface px-2 py-1 rounded border border-borderMuted">
                    <i class="ph ph-arrows-clockwise animate-spin hidden" id="history-sync-spinner"></i>
                    <span id="history-sync-text">Đã đồng bộ</span>
                </div>
            </div>
            
            <div id="history-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-5">
                <!-- Render lịch sử -->
            </div>
            
            <div id="history-empty" class="hidden text-center py-20 bg-surface/30 rounded-xl border border-borderMuted">
                <i class="ph ph-film-slate text-4xl text-borderMuted mb-3"></i>
                <p class="text-textMuted">Chưa có dữ liệu xem phim.</p>
            </div>
        </div>

    </main>

    <!-- HỆ THỐNG APP LOGIC -->
    <script>
        /**
         * ==========================================
         * 1. CẤU HÌNH ĐỒNG BỘ ĐÁM MÂY (JSONBin.io)
         * ==========================================
         */
        const CLOUD_SYNC = {
            enabled: true,
            BIN_ID: '6ae947e0ac6210605a67652f',
            API_KEY: '$2a$10$lti09mn6/rgWl7E6Fgqi5.5rBgWNmrSqVYfoaZTHloVjCMRWIl4gC'
        };

        /**
         * ==========================================
         * 2. TIỆN ÍCH XỬ LÝ ẢNH
         * ==========================================
         */
        function getSafeImageUrl(domain, path) {
            const fallback = 'https://placehold.co/300x450/1e293b/94a3b8?text=No+Image';
            if (!path) return fallback;
            if (path.startsWith('http')) return path;
            
            // Xử lý chuẩn hóa tên miền và path để có đúng 1 dấu "/"
            const safeDomain = domain ? domain.replace(/\/$/, '') : '';
            const safePath = path.replace(/^\//, '');
            return safeDomain ? `${safeDomain}/${safePath}` : fallback;
        }

        /**
         * ==========================================
         * 3. MODULE QUẢN LÝ LỊCH SỬ (Local + Cloud)
         * ==========================================
         */
        const HistoryManager = {
            storageKey: 'cinesync_history_v2',
            cloudDataCache: null,
            isFetchingCloud: false,
            syncTimer: null,
            
            async init() {
                // Thử load từ localStorage ngay lập tức để có dữ liệu phản hồi nhanh
                const localStr = localStorage.getItem(this.storageKey);
                if (localStr) {
                    try { this.cloudDataCache = JSON.parse(localStr); } 
                    catch (e) { this.cloudDataCache = {}; }
                } else {
                    this.cloudDataCache = {};
                }

                // Gọi JSONBin ngầm trên background
                if (CLOUD_SYNC.enabled) {
                    this.isFetchingCloud = true;
                    this.updateSyncUI(true, 'Đang tải Cloud...');
                    try {
                        const res = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_SYNC.BIN_ID}/latest`, {
                            headers: { 'X-Master-Key': CLOUD_SYNC.API_KEY }
                        });
                        if (res.ok) {
                            const json = await res.json();
                            if (json && json.record && !Array.isArray(json.record)) {
                                // Ghi đè local bằng cloud
                                this.cloudDataCache = json.record;
                                localStorage.setItem(this.storageKey, JSON.stringify(this.cloudDataCache));
                            }
                        }
                    } catch (e) {
                        console.error("Lỗi đồng bộ mây:", e);
                    } finally {
                        this.isFetchingCloud = false;
                        this.updateSyncUI(false, 'Đã đồng bộ');
                    }
                }
            },

            updateSyncUI(isLoading, text) {
                const spinner = document.getElementById('history-sync-spinner');
                const textEl = document.getElementById('history-sync-text');
                if(spinner) isLoading ? spinner.classList.remove('hidden') : spinner.classList.add('hidden');
                if(textEl) textEl.textContent = text;
            },

            async getHistory() {
                if (!this.cloudDataCache) await this.init();
                return this.cloudDataCache;
            },

            async saveProgress(movieData, episodeData, currentTime, duration) {
                if (!movieData || !episodeData || currentTime < 5) return false;

                const id = movieData.slug;
                
                // Cập nhật Cache Local
                this.cloudDataCache[id] = {
                    id: id,
                    name: movieData.name,
                    thumb: movieData.thumb_url,
                    source: movieData.source,
                    currentEpisode: { name: episodeData.name, slug: episodeData.slug },
                    currentTime: currentTime,
                    duration: duration || 0,
                    updatedAt: Date.now()
                };

                // Lưu LocalStorage lập tức (Debounce chống giật nếu cần)
                localStorage.setItem(this.storageKey, JSON.stringify(this.cloudDataCache));

                // Debounce/Throttle Push lên Cloud (Giới hạn 15s / 1 lần gọi API PUT)
                if (CLOUD_SYNC.enabled && !this.syncTimer) {
                    this.syncTimer = setTimeout(async () => {
                        this.syncTimer = null;
                        try {
                            await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_SYNC.BIN_ID}`, {
                                method: 'PUT',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-Master-Key': CLOUD_SYNC.API_KEY
                                },
                                body: JSON.stringify(this.cloudDataCache)
                            });
                        } catch (e) { console.error("Lỗi đẩy Cloud", e); }
                    }, 15000);
                }
                return true;
            },

            async getMovieProgress(slug) {
                return this.cloudDataCache ? this.cloudDataCache[slug] : null;
            }
        };

        /**
         * ==========================================
         * 4. APP LOGIC CHÍNH
         * ==========================================
         */
        const app = {
            hls: null,
            currentView: '',
            currentMovie: null,
            currentEpisode: null,
            lastSaveTime: 0,
            saveInterval: 5,
            homeLoaded: false,
            
            init() {
                HistoryManager.init(); // Kích hoạt kéo Cloud History ngầm
                this.bindEvents();
                this.navigate('home');
            },

            bindEvents() {
                // Tìm kiếm Form
                const searchForm = document.getElementById('search-form');
                searchForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const keyword = document.getElementById('search-input').value.trim();
                    if (keyword) {
                        this.navigate('search', { keyword });
                        document.getElementById('search-input').blur();
                    }
                });

                // Lưu tiến trình Player
                const video = document.getElementById('player');
                video.addEventListener('timeupdate', () => {
                    const now = video.currentTime;
                    if (Math.abs(now - this.lastSaveTime) >= this.saveInterval) {
                        this.triggerSync(now, video.duration);
                        this.lastSaveTime = now;
                    }
                });

                // Thiết lập vuốt ngang cho trang chủ Nổi Bật
                this.initDragScroll('home-trending-container');
            },

            // Kỹ thuật vuốt mượt ngang bằng chuột & tránh vô tình click
            initDragScroll(containerId) {
                const slider = document.getElementById(containerId);
                if (!slider) return;
                
                let isDown = false;
                let startX;
                let scrollLeft;
                let dragged = false; // Phân biệt click vs drag

                slider.addEventListener('mousedown', (e) => {
                    isDown = true;
                    dragged = false;
                    slider.classList.add('cursor-grabbing');
                    slider.classList.remove('cursor-grab');
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                });

                slider.addEventListener('mouseleave', () => {
                    isDown = false;
                    slider.classList.remove('cursor-grabbing');
                    slider.classList.add('cursor-grab');
                });

                slider.addEventListener('mouseup', () => {
                    isDown = false;
                    slider.classList.remove('cursor-grabbing');
                    slider.classList.add('cursor-grab');
                });

                slider.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    const walk = (x - startX) * 2; // Hệ số tốc độ cuộn
                    if (Math.abs(x - startX) > 5) dragged = true;
                    slider.scrollLeft = scrollLeft - walk;
                });

                // Ngăn click nếu vừa kéo
                slider.addEventListener('click', (e) => {
                    if (dragged) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }, true); // Bắt ở capture phase
            },

            navigate(viewName, params = {}) {
                // Tắt nhạc/video nếu rời trang detail
                if (this.currentView === 'detail' && viewName !== 'detail') {
                    this.stopPlayer();
                }

                this.currentView = viewName;
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                const viewEl = document.getElementById(`view-${viewName}`);
                if (viewEl) viewEl.classList.remove('hidden');

                switch (viewName) {
                    case 'home': this.loadHomePage(); break;
                    case 'search': this.executeSearch(params.keyword); break;
                    case 'detail': this.loadDetail(params.slug, params.source); break;
                    case 'history': this.renderHistoryView(); break;
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            toggleLoading(show) {
                const el = document.getElementById('loading-overlay');
                show ? el.classList.remove('hidden') : el.classList.add('hidden');
            },

            /**
             * ==========================================
             * 5. API FETCH & HIỂN THỊ
             * ==========================================
             */
            
            async loadHomePage() {
                if (this.homeLoaded) return;
                this.homeLoaded = true;
                
                try {
                    // 1. Fetch Nổi Bật từ NguonC
                    fetch('https://phim.nguonc.com/api/films/phim-moi-cap-nhat?page=1')
                        .then(r => r.json())
                        .then(res => {
                            if (res && res.items) {
                                const trending = res.items.slice(0, 15).map(item => ({
                                    source: 'nguonc',
                                    name: item.name,
                                    origin_name: item.original_name || item.origin_name || '',
                                    slug: item.slug,
                                    thumb_url: getSafeImageUrl('', item.thumb_url)
                                }));
                                this.renderList(trending, 'home-trending-container', true);
                            }
                        }).catch(e => console.error("Lỗi NguonC:", e));

                    // 2. Fetch Phim Lẻ từ KKPhim
                    fetch('https://phimapi.com/v1/api/danh-sach/phim-le')
                        .then(r => r.json())
                        .then(res => {
                            if (res?.data?.items) {
                                const imageDomain = res.data.APP_DOMAIN_CDN_IMAGE;
                                const theaters = res.data.items.slice(0, 18).map(item => ({
                                    source: 'kkphim',
                                    name: item.name,
                                    origin_name: item.origin_name,
                                    slug: item.slug,
                                    thumb_url: getSafeImageUrl(imageDomain, item.thumb_url)
                                }));
                                this.renderList(theaters, 'home-theater-container', false);
                            }
                        }).catch(e => console.error("Lỗi KKPhim:", e));
                } catch (e) {
                    console.error("Lỗi home", e);
                }
            },

            async executeSearch(keyword) {
                this.toggleLoading(true);
                document.getElementById('search-keyword-display').textContent = keyword;
                
                try {
                    // Sử dụng endpoint chuẩn xác của 2 API
                    const urlKK = `https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(keyword)}&limit=20`;
                    const urlNC = `https://phim.nguonc.com/api/films/search?keyword=${encodeURIComponent(keyword)}`;

                    const [resKK, resNC] = await Promise.allSettled([
                        fetch(urlKK).then(r => r.json()),
                        fetch(urlNC).then(r => r.json())
                    ]);

                    let results = [];

                    // Xử lý KKPhim
                    if (resKK.status === 'fulfilled' && resKK.value) {
                        const data = resKK.value.data?.items || [];
                        const domain = resKK.value.data?.APP_DOMAIN_CDN_IMAGE || '';
                        const mapped = data.map(item => ({
                            source: 'kkphim',
                            name: item.name,
                            origin_name: item.origin_name,
                            slug: item.slug,
                            thumb_url: getSafeImageUrl(domain, item.thumb_url)
                        }));
                        results.push(...mapped);
                    }

                    // Xử lý NguonC
                    if (resNC.status === 'fulfilled' && resNC.value?.items) {
                        const mapped = resNC.value.items.map(item => ({
                            source: 'nguonc',
                            name: item.name,
                            origin_name: item.original_name || item.origin_name,
                            slug: item.slug,
                            thumb_url: getSafeImageUrl('', item.thumb_url)
                        }));
                        results.push(...mapped);
                    }

                    this.renderSearch(results);
                } catch (error) {
                    console.error("Lỗi Search:", error);
                } finally {
                    this.toggleLoading(false);
                }
            },

            async loadDetail(slug, source) {
                this.toggleLoading(true);
                this.stopPlayer();
                document.getElementById('player-overlay').classList.remove('hidden');
                
                try {
                    let movie = null;
                    if (source === 'kkphim') {
                        const res = await fetch(`https://phimapi.com/phim/${slug}`).then(r => r.json());
                        if (res.status && res.movie) {
                            movie = {
                                source: 'kkphim',
                                slug: res.movie.slug,
                                name: res.movie.name,
                                origin_name: res.movie.origin_name,
                                content: res.movie.content,
                                thumb_url: getSafeImageUrl('', res.movie.thumb_url),
                                episodes: res.episodes.map(server => ({
                                    server_name: server.server_name,
                                    items: server.server_data.map(ep => ({
                                        name: ep.name,
                                        slug: ep.slug,
                                        link_m3u8: ep.link_m3u8
                                    }))
                                }))
                            };
                        }
                    } 
                    else if (source === 'nguonc') {
                        const res = await fetch(`https://phim.nguonc.com/api/film/${slug}`).then(r => r.json());
                        if (res.status === 'success' && res.movie) {
                            movie = {
                                source: 'nguonc',
                                slug: res.movie.slug,
                                name: res.movie.name,
                                origin_name: res.movie.original_name,
                                content: res.movie.description || 'Chưa cập nhật nội dung.',
                                thumb_url: getSafeImageUrl('', res.movie.thumb_url),
                                episodes: res.movie.episodes.map(server => ({
                                    server_name: server.server_name,
                                    items: server.items.map(ep => ({
                                        name: ep.name,
                                        slug: ep.slug,
                                        link_m3u8: ep.m3u8
                                    }))
                                }))
                            };
                        }
                    }

                    if (!movie) throw new Error("API trống");
                    this.currentMovie = movie;
                    this.renderDetail(movie);

                } catch (error) {
                    alert("Không tải được chi tiết phim này.");
                    this.navigate('home');
                } finally {
                    this.toggleLoading(false);
                }
            },

            /**
             * ==========================================
             * 6. RENDER COMPONENTS
             * ==========================================
             */

            renderList(items, containerId, isHorizontal) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';

                items.forEach(item => {
                    const card = document.createElement('div');
                    // Style phân biệt scroll ngang và lưới
                    if (isHorizontal) {
                        card.className = 'group cursor-pointer flex-none w-[140px] sm:w-[160px] md:w-[180px] snap-start relative flex flex-col no-select';
                    } else {
                        card.className = 'group cursor-pointer flex flex-col relative';
                    }
                    
                    card.onclick = () => this.navigate('detail', { slug: item.slug, source: item.source });

                    const badgeClass = item.source === 'kkphim' ? 'bg-indigo-900/80 text-indigo-200 border-indigo-700/50' : 'bg-teal-900/80 text-teal-200 border-teal-700/50';

                    card.innerHTML = `
                        <div class="relative aspect-[2/3] rounded-xl overflow-hidden bg-surface border border-borderMuted group-hover:border-accent transition-colors shadow-lg">
                            <img src="${item.thumb_url}" draggable="false" alt="${item.name}" loading="lazy" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-all duration-500 scale-100 group-hover:scale-105">
                            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-base/50 transition-opacity">
                                <i class="ph-fill ph-play-circle text-5xl text-white drop-shadow-xl"></i>
                            </div>
                            <div class="absolute top-2 right-2 px-1.5 py-0.5 rounded text-[9px] uppercase font-bold tracking-wider border backdrop-blur-sm shadow-sm ${badgeClass}">
                                ${item.source}
                            </div>
                        </div>
                        <div class="mt-3 px-1">
                            <h3 class="font-medium text-sm text-textMain line-clamp-1 group-hover:text-accent transition-colors">${item.name}</h3>
                            <p class="text-xs text-textMuted mt-1 line-clamp-1">${item.origin_name || ''}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            },

            renderSearch(items) {
                const container = document.getElementById('search-grid');
                const empty = document.getElementById('search-empty');
                container.innerHTML = '';

                if (items.length === 0) {
                    empty.classList.remove('hidden');
                    return;
                }
                empty.classList.add('hidden');
                
                // Tái sử dụng logic render list nhưng dưới dạng grid
                this.renderList(items, 'search-grid', false);
            },

            async renderDetail(movie) {
                document.getElementById('detail-title').textContent = movie.name;
                document.getElementById('detail-origin-name').textContent = movie.origin_name;
                document.getElementById('detail-breadcrumb-name').textContent = movie.name;
                document.getElementById('detail-content').innerHTML = movie.content;

                const badge = document.getElementById('detail-source-badge');
                badge.textContent = movie.source;
                badge.className = `px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider border shadow-sm ${
                    movie.source === 'kkphim' ? 'bg-indigo-900/50 text-indigo-200 border-indigo-700' : 'bg-teal-900/50 text-teal-200 border-teal-700'
                }`;

                const epContainer = document.getElementById('episodes-container');
                epContainer.innerHTML = '';
                
                // Xác định tập Resume từ Cloud/Local
                const historyRecord = await HistoryManager.getMovieProgress(movie.slug);
                let defaultEp = null;
                let resumeTime = 0;

                movie.episodes.forEach(server => {
                    const block = document.createElement('div');
                    block.innerHTML = `<div class="text-[11px] text-textMuted uppercase mb-3 font-semibold tracking-wider flex items-center gap-2"><i class="ph-fill ph-hard-drives text-accent"></i> ${server.server_name}</div>`;
                    const grid = document.createElement('div');
                    grid.className = 'grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-2 xl:grid-cols-3 gap-2';

                    server.items.forEach(ep => {
                        if (!defaultEp) defaultEp = ep;
                        if (historyRecord && historyRecord.currentEpisode.slug === ep.slug) {
                            defaultEp = ep;
                            resumeTime = historyRecord.currentTime;
                        }

                        const btn = document.createElement('button');
                        btn.id = `btn-ep-${ep.slug}`;
                        btn.className = 'ep-btn w-full py-2 px-2 text-xs font-medium rounded bg-base border border-borderMuted text-textMuted hover:text-white hover:border-accent transition-colors truncate outline-none';
                        btn.textContent = ep.name;
                        // Click tay -> phát từ giây 0
                        btn.onclick = () => this.playEpisode(ep, 0); 
                        
                        grid.appendChild(btn);
                    });
                    block.appendChild(grid);
                    epContainer.appendChild(block);
                });

                this.currentMovie.resumeEp = defaultEp;
                this.currentMovie.resumeTime = resumeTime;
            },

            async renderHistoryView() {
                const historyData = await HistoryManager.getHistory();
                const container = document.getElementById('history-grid');
                const empty = document.getElementById('history-empty');
                
                container.innerHTML = '';
                const items = Object.values(historyData).sort((a, b) => b.updatedAt - a.updatedAt);

                if (items.length === 0) {
                    empty.classList.remove('hidden');
                    return;
                }
                empty.classList.add('hidden');

                items.forEach(item => {
                    const progress = item.duration ? Math.min((item.currentTime / item.duration) * 100, 100) : 0;
                    
                    const card = document.createElement('div');
                    card.className = 'flex gap-3 p-3 rounded-xl border border-borderMuted bg-surface hover:border-accent cursor-pointer transition-colors group shadow-md';
                    card.onclick = () => this.navigate('detail', { slug: item.id, source: item.source });

                    card.innerHTML = `
                        <div class="w-20 aspect-[2/3] shrink-0 bg-base rounded-md overflow-hidden border border-borderMuted relative">
                            <img src="${item.thumb}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                            <button onclick="event.stopPropagation(); app.removeHistory('${item.id}')" class="absolute top-1 right-1 bg-black/70 text-textMuted rounded p-1 hover:text-red-400 backdrop-blur transition-colors">
                                <i class="ph ph-trash text-xs"></i>
                            </button>
                        </div>
                        <div class="flex flex-col flex-1 py-1 overflow-hidden">
                            <div class="flex items-center mb-1">
                                <span class="px-1.5 py-0.5 rounded text-[8px] font-bold uppercase border border-borderMuted text-textMuted bg-base">${item.source}</span>
                            </div>
                            <h3 class="text-sm font-medium text-white line-clamp-2 leading-tight">${item.name}</h3>
                            <p class="text-[11px] text-textMuted mt-1 bg-base/50 inline-block px-1.5 py-0.5 rounded self-start">Tập ${item.currentEpisode.name}</p>
                            
                            <div class="mt-auto pt-3">
                                <div class="w-full h-1 bg-base rounded-full overflow-hidden border border-borderMuted/50">
                                    <div class="h-full bg-accent transition-all relative" style="width: ${progress}%">
                                        <div class="absolute inset-0 bg-white/20"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            },

            async removeHistory(id) {
                if (HistoryManager.cloudDataCache[id]) {
                    delete HistoryManager.cloudDataCache[id];
                    localStorage.setItem(HistoryManager.storageKey, JSON.stringify(HistoryManager.cloudDataCache));
                    // Force PUT to cloud
                    if (CLOUD_SYNC.enabled) {
                        try {
                            await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_SYNC.BIN_ID}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', 'X-Master-Key': CLOUD_SYNC.API_KEY },
                                body: JSON.stringify(HistoryManager.cloudDataCache)
                            });
                        } catch(e){}
                    }
                    this.renderHistoryView();
                }
            },

            /**
             * ==========================================
             * 7. PLAYER LOGIC (HLS.js)
             * ==========================================
             */

            playFirstAvailableEpisode() {
                if (this.currentMovie?.resumeEp) {
                    this.playEpisode(this.currentMovie.resumeEp, this.currentMovie.resumeTime);
                }
            },

            playEpisode(episodeData, resumeTime = 0) {
                this.currentEpisode = episodeData;
                this.lastSaveTime = resumeTime;

                // UI Nút tập phim
                document.querySelectorAll('.ep-btn').forEach(btn => {
                    btn.classList.remove('bg-accent', 'text-slate-900', 'border-transparent', 'shadow-md');
                    btn.classList.add('bg-base', 'text-textMuted', 'border-borderMuted');
                });
                const activeBtn = document.getElementById(`btn-ep-${episodeData.slug}`);
                if (activeBtn) {
                    activeBtn.classList.remove('bg-base', 'text-textMuted', 'border-borderMuted');
                    activeBtn.classList.add('bg-accent', 'text-slate-900', 'border-transparent', 'shadow-md');
                }

                document.getElementById('player-overlay').classList.add('hidden');

                const video = document.getElementById('player');
                const sourceUrl = episodeData.link_m3u8;

                if (this.hls) {
                    this.hls.destroy();
                    this.hls = null;
                }

                if (Hls.isSupported()) {
                    this.hls = new Hls({ maxBufferLength: 30 });
                    this.hls.loadSource(sourceUrl);
                    this.hls.attachMedia(video);
                    
                    this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        if (resumeTime > 5) {
                            video.currentTime = resumeTime;
                            this.showSyncNotify(`Tiếp tục xem tập ${episodeData.name}`);
                        }
                        video.play().catch(e => console.log("Autoplay bị chặn bởi trình duyệt"));
                    });
                } 
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = sourceUrl;
                    video.addEventListener('loadedmetadata', function onLoaded() {
                        if (resumeTime > 5) {
                            video.currentTime = resumeTime;
                            app.showSyncNotify(`Tiếp tục xem tập ${episodeData.name}`);
                        }
                        video.play();
                        video.removeEventListener('loadedmetadata', onLoaded);
                    });
                }
            },

            stopPlayer() {
                const video = document.getElementById('player');
                video.pause();
                video.removeAttribute('src');
                video.load();
                if (this.hls) {
                    this.hls.destroy();
                    this.hls = null;
                }
                this.currentEpisode = null;
            },

            async triggerSync(currentTime, duration) {
                const success = await HistoryManager.saveProgress(this.currentMovie, this.currentEpisode, currentTime, duration);
                if (success && Math.random() < 0.1) { // 10% cơ hội hiện thông báo để UI đỡ rối
                    this.showSyncNotify("Đã lưu tiến trình ngầm");
                }
            },

            showSyncNotify(message) {
                const box = document.getElementById('sync-notification');
                document.getElementById('sync-message').textContent = message;
                
                box.classList.remove('hidden');
                setTimeout(() => box.classList.add('hidden'), 3000);
            }
        };

        // Khởi động
        document.addEventListener('DOMContentLoaded', () => app.init());

    </script>
</body>
</html>
